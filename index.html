<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人日历 · Personal Calendar</title>
<style>
  :root{
    --primary:#5B5FEF; --primary2:#8B5CF6;
    --bg:#F4F5FB; --card:#FFFFFF; --line:#E8EAF3;
    --text:#1E2337; --text2:#6B7280; --text3:#9CA3AF;
    --blue:#3B82F6; --orange:#F59E0B; --green:#10B981; --red:#EF4444;
    --radius:14px;
    --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
  }
  .app{max-width:1280px;margin:0 auto;padding:16px 20px 40px;}

  /* ===== Header ===== */
  .header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 4px 14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.5px;}
  .brand svg{display:block;}
  .brand .grad{background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .sync-status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex:none;}
  .dot.ok{background:var(--green);} .dot.err{background:var(--red);} .dot.sync{background:var(--orange);} .dot.dirty{background:var(--orange);}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text2);cursor:pointer;transition:.15s;}
  .icon-btn:hover{color:var(--primary);border-color:var(--primary);}

  /* ===== Layout: 左窄日历 + 右宽记录区 ===== */
  .main{display:grid;grid-template-columns:308px minmax(0,1fr);gap:16px;align-items:start;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6);}

  /* ===== Calendar（压缩紧凑版）===== */
  .cal-bar{display:none;width:100%;align-items:center;justify-content:space-between;background:#fff;border:none;border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px;font-size:14.5px;font-weight:700;color:var(--text);cursor:pointer;margin-bottom:10px;}
  .cal-bar .arr{color:var(--text2);font-size:12px;transition:.2s;}
  .cal-bar .arr.open{transform:rotate(180deg);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 12px 4px;}
  .cal-title{font-size:15.5px;font-weight:700;}
  .cal-nav{display:flex;align-items:center;gap:3px;}
  .nav-btn{width:26px;height:26px;border:none;background:#F1F2F9;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;}
  .nav-btn:hover{background:#E6E7F5;color:var(--primary);}
  .today-btn{border:1px solid var(--line);background:#fff;color:var(--primary);font-size:12px;padding:3px 10px;border-radius:7px;cursor:pointer;margin-left:4px;}
  .today-btn:hover{background:#F4F4FE;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 8px 10px;}
  .dow{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;font-weight:600;}
  .day{min-height:44px;border-radius:8px;padding:3px 4px;cursor:pointer;position:relative;transition:background .12s;border:1px solid transparent;}
  .day:hover{background:#F6F7FD;}
  .day.other{color:var(--text3);background:transparent;opacity:.55;}
  .day.today .num{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 2px 6px rgba(91,95,239,.35);}
  .day.selected{border-color:var(--primary);background:#F0F0FE;}
  .day .num{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;}
  .dots{position:absolute;bottom:4px;left:4px;right:4px;display:flex;gap:3px;justify-content:center;}
  .dots i{width:5px;height:5px;border-radius:50%;flex:none;}
  .d-sched{background:var(--blue);} .d-todo{background:var(--orange);} .d-note{background:var(--green);}

  /* ===== Day panel：上输入区 + 下历史流 ===== */
  .day-panel{display:flex;flex-direction:column;}
  .panel-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;}
  .panel-date{font-size:16.5px;font-weight:700;}
  .panel-date .w{font-size:12.5px;color:var(--text2);font-weight:600;margin-left:6px;}
  .tabs{display:flex;gap:2px;margin:12px 14px 0;background:#F1F2F9;border-radius:10px;padding:4px;}
  .tab{flex:1;text-align:center;padding:7px 0;font-size:13px;font-weight:600;color:var(--text2);border-radius:8px;cursor:pointer;transition:.15s;border:none;background:transparent;}
  .tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(15,23,42,.08);}

  /* ---- 输入区 ---- */
  .panel-input{padding:14px 18px 0;}
  .panel-input.hidden{display:none;}
  .quick-add{display:flex;gap:8px;align-items:center;background:#F8F9FE;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .quick-add.editing{flex-wrap:wrap;}
  .quick-add input[type="time"]{width:106px;flex:none;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
  .quick-add input[type="text"]{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
  .quick-add input:focus{border-color:var(--primary);}
  .quick-add input::placeholder{color:var(--text3);}
  .qa-hint{font-size:11.5px;color:var(--text3);margin-top:6px;padding-left:2px;}
  .qa-hint .edit-tag{color:var(--primary);font-weight:600;}

  /* ---- 历史流 ---- */
  .panel-flow{padding:8px 18px 18px;max-height:calc(100vh - 320px);min-height:220px;overflow-y:auto;scrollbar-width:thin;}
  .panel-flow::-webkit-scrollbar{width:5px;}
  .panel-flow::-webkit-scrollbar-thumb{background:#D9DCEA;border-radius:3px;}
  .fd{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:#fff;font-weight:700;font-size:12.5px;color:var(--text2);margin:10px 0 8px;padding:4px 0;}
  .fd::after{content:"";flex:1;height:1px;background:var(--line);}
  .fd .is-today{font-size:11px;background:#FEF3C7;color:#B45309;border-radius:4px;padding:0 7px;font-weight:700;}
  .fd .is-sel{font-size:11px;background:#E0E7FF;color:var(--primary);border-radius:4px;padding:0 7px;font-weight:700;}
  .flow-empty{color:var(--text3);text-align:center;padding:16px 0 8px;font-size:12.5px;}
  .flow-all-empty{color:var(--text3);text-align:center;padding:34px 0;font-size:13px;}

  /* 日程条目（流内） */
  .ev{display:flex;align-items:flex-start;gap:10px;background:#FAFBFE;border:1px solid var(--line);border-radius:10px;padding:9px 12px;position:relative;margin-bottom:7px;}
  .ev-time{font-size:12.5px;font-weight:700;color:var(--blue);background:rgba(59,130,246,.08);border-radius:6px;padding:2px 8px;flex:none;margin-top:1px;min-width:52px;text-align:center;}
  .ev-time.all{background:rgba(16,185,129,.1);color:#0B8A5D;}
  .ev-body{flex:1;min-width:0;}
  .ev-title{font-weight:600;font-size:13.5px;}
  .ev-note{font-size:12.5px;color:var(--text2);white-space:pre-wrap;word-break:break-all;}
  .ev-ops{position:absolute;right:8px;top:8px;display:flex;gap:2px;opacity:0;transition:.12s;}
  .ev:hover .ev-ops{opacity:1;}
  .ev-op{width:22px;height:22px;border:none;background:transparent;color:var(--text3);border-radius:6px;cursor:pointer;font-size:13px;}
  .ev-op:hover{background:#E6E7F5;color:var(--primary);}
  .ev-op.del:hover{color:var(--red);background:#fee2e2;}
  .btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;transition:.15s;white-space:nowrap;}
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:#EEF0F8;color:var(--text);} .btn.ghost:hover{background:#E2E4F0;}
  .btn.sm{padding:5px 12px;font-size:12.5px;}

  /* 待办条目（流内） */
  .todo{display:flex;align-items:center;gap:10px;background:#FAFBFE;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;}
  .todo .ck{width:18px;height:18px;border-radius:50%;border:2px solid #CFD3E4;flex:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.15s;background:#fff;}
  .todo .ck.on{background:var(--green);border-color:var(--green);}
  .todo .ck.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg) translate(-1px,-1px);}
  .todo .txt{flex:1;font-size:13.5px;word-break:break-all;}
  .todo.done .txt{color:var(--text3);text-decoration:line-through;}
  .todo .del{width:22px;height:22px;border:none;background:transparent;color:var(--text3);border-radius:6px;cursor:pointer;font-size:14px;opacity:0;}
  .todo:hover .del{opacity:1;} .todo .del:hover{color:var(--red);background:#fee2e2;}
  .day-done-count{font-size:11px;color:var(--text3);margin-left:auto;}

  /* 日记卡（流内） */
  .jr-card{background:#FAFBFE;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .jr-card:hover{border-color:var(--primary);background:#FCFCFF;}
  .jr-card .jc-ds{font-size:11.5px;font-weight:700;color:var(--text3);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;}
  .jr-card .jc-ds .go{font-size:11px;color:var(--primary);font-weight:600;opacity:0;}
  .jr-card:hover .jc-ds .go{opacity:1;}
  .jr-card .jc-text{font-size:13px;color:var(--text2);white-space:pre-wrap;word-break:break-all;max-height:60px;overflow:hidden;}

  /* 随记卡 */
  .note-card{background:#FAFBFE;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:8px;position:relative;}
  .note-card .nc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .note-card .nc-time{font-size:11px;color:var(--text3);font-weight:600;}
  .note-card .nc-del{width:20px;height:20px;border:none;background:transparent;color:var(--text3);border-radius:5px;cursor:pointer;font-size:12px;opacity:0;}
  .note-card:hover .nc-del{opacity:1;} .note-card .nc-del:hover{color:var(--red);background:#fee2e2;}
  .note-card .nc-text{font-size:13.5px;color:var(--text);white-space:pre-wrap;word-break:break-all;line-height:1.7;}

  /* 习惯（流区整体展示） */
  .habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .habit{position:relative;background:#FAFBFE;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;}
  .habit .h-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;padding-right:76px;}
  .habit .h-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .habit .h-streak{font-size:12px;color:var(--text2);}
  .habit .h-streak b{color:var(--orange);}
  .habit .check-btn{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:2px solid #CFD3E4;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.15s;}
  .habit .check-btn.on{background:linear-gradient(135deg,var(--green),#34D399);border-color:transparent;}
  .habit .check-btn.on::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(40deg) translate(-1px,-1px);}
  .habit .rm{position:absolute;right:44px;top:12px;width:22px;height:22px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;opacity:0;border-radius:6px;}
  .habit:hover .rm{opacity:1;} .habit .rm:hover{color:var(--red);background:#fee2e2;}
  .habit-stats{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
  .hs-title{font-size:13px;font-weight:700;margin-bottom:8px;}
  .hs-item{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .hs-item .hs-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .hs-item .hs-name{font-size:12.5px;width:64px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hs-item .hs-bar{flex:1;height:5px;background:#EEF0F8;border-radius:3px;overflow:hidden;}
  .hs-item .hs-bar i{display:block;height:100%;border-radius:3px;}
  .hs-item .hs-num{font-size:11.5px;color:var(--text2);flex:none;min-width:44px;text-align:right;}
  .hs-nomonth{font-size:12px;color:var(--text3);}
  .habit-empty{text-align:center;color:var(--text3);padding:30px 0;font-size:13px;}

  /* ===== Modal ===== */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:16px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(15,23,42,.25);max-height:90vh;overflow:auto;}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0;}
  .modal-h h3{font-size:16px;font-weight:700;}
  .modal-x{border:none;background:transparent;font-size:18px;color:var(--text3);cursor:pointer;}
  .modal-b{padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text2);}
  .field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--text);}
  .field input:focus,.field select:focus{border-color:var(--primary);}
  .field .hint{font-size:11.5px;color:var(--text3);line-height:1.5;}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .toast-msg{font-size:12.5px;min-height:18px;}
  .toast-msg.ok{color:var(--green);} .toast-msg.err{color:var(--red);}
  .divider{height:1px;background:var(--line);margin:6px 0;}
  .link-btn{background:none;border:none;color:var(--primary);cursor:pointer;font-size:12.5px;padding:2px 0;text-align:left;}
  .link-btn:hover{text-decoration:underline;}
  .data-ops{display:flex;flex-direction:column;gap:6px;}
  .data-ops .row{display:flex;gap:8px;}

  /* 外观配色板 */
  .palette{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .pbtn{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:.15s;padding:0;}
  .pbtn:hover{transform:scale(1.12);}
  .pbtn.on{box-shadow:0 0 0 2px var(--primary);}
  .psep{flex:1;}
  #themeCustomColor,#bgColorPick{width:44px;height:30px;border:none;background:none;cursor:pointer;padding:0;}
  #themeCustomColor::-webkit-color-swatch-wrapper,#bgColorPick::-webkit-color-swatch-wrapper{padding:0;}
  #themeCustomColor::-webkit-color-swatch,#bgColorPick::-webkit-color-swatch{border:1px solid var(--line);border-radius:6px;}

  .footer{text-align:center;color:var(--text3);font-size:12px;padding:22px 0 6px;}

  /* ===== Responsive ===== */
  @media (max-width:960px){
    .main{grid-template-columns:1fr;}
    .cal-bar{display:flex;}
    #calBody{display:none;}
    #calBody.open{display:block;}
    .panel-flow{max-height:none;}
  }
  @media (max-width:560px){
    .app{padding:10px 10px 30px;}
    .habit-grid{grid-template-columns:1fr;}
    .panel-input{padding:12px 12px 0;}
    .panel-flow{padding:6px 12px 14px;}
    .brand{font-size:17px;}
    .quick-add input[type="time"]{width:96px;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="url(#lg1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#5B5FEF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
        <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>
      </svg>
      <span>个人日历 <span class="grad">Personal Calendar</span></span>
    </div>
    <div class="header-right">
      <div class="sync-status" id="syncStatus" title="云端同步状态">
        <span class="dot" id="syncDot"></span><span id="syncText">未连接云端</span>
      </div>
      <button class="icon-btn" id="btnSyncNow" title="立即同步到云端">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="main">
    <!-- Calendar（压缩版） -->
    <div>
      <button class="cal-bar" id="calBar" onclick="toggleCal()">
        <span id="calBarText">日历</span><span class="arr" id="calArrow">&#9662;</span>
      </button>
      <section class="card" id="calBody">
        <div class="cal-head">
          <div class="cal-title" id="calTitle">2026年10月</div>
          <div class="cal-nav">
            <button class="nav-btn" onclick="shiftMonth(-1)" title="上个月">&#8249;</button>
            <button class="today-btn" onclick="goToday()">今天</button>
            <button class="nav-btn" onclick="shiftMonth(1)" title="下个月">&#8250;</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </section>
    </div>

    <!-- Day panel：上输入区 + 下历史流 -->
    <section class="card day-panel">
      <div class="panel-top">
        <div class="panel-date" id="panelDate"></div>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="schedule" onclick="switchTab('schedule')">日程</button>
        <button class="tab" data-tab="todo" onclick="switchTab('todo')">待办</button>
        <button class="tab" data-tab="journal" onclick="switchTab('journal')">日记</button>
        <button class="tab" data-tab="note" onclick="switchTab('note')">随记</button>
        <button class="tab" data-tab="habit" onclick="switchTab('habit')">习惯</button>
      </div>
      <div class="panel-input" id="panelInput"></div>
      <div class="panel-flow" id="panelFlow"></div>
    </section>
  </div>

  <footer class="footer">数据存储于你的 GitHub 私有仓库 · 由 Data Agent 生成 · <b>V4.1</b></footer>
</div>

<!-- Settings Modal -->
<div class="mask" id="maskSettings">
  <div class="modal">
    <div class="modal-h"><h3>设置 · 云端同步</h3><button class="modal-x" onclick="closeMasks()">&#10005;</button></div>
    <div class="modal-b">
      <div class="field">
        <label>GitHub Token</label>

<script>
"use strict";
/* ================================================================
 * 个人日历 · Personal Calendar V3
 * - 布局：左窄日历 + 右宽记录区（上快捷输入 / 下历史信息流）
 * - 历史流：日程/待办/日记从选中日期开始按天分组倒序下滑浏览
 * - 快捷输入：时间留空=全天事件，标题回车即添加
 * - 同步：本地缓存 + GitHub Contents API；窗口聚焦自动拉取云端
 * - Token 由用户在设置中填入，仅存 localStorage，绝不写入代码
 * ================================================================ */

/* ---------- 默认配置（可在设置中修改） ---------- */
const DEFAULT_OWNER = 'zhuy99817-rgb';
const DEFAULT_REPO  = 'personal-calendar';
const DATA_PATH     = 'data/records.json';
const LS_KEY_DATA   = 'pc_data_v1';
const LS_KEY_TOKEN  = 'pc_gh_token';
const LS_KEY_OWNER  = 'pc_gh_owner';
const LS_KEY_REPO   = 'pc_gh_repo';
const LS_KEY_VIEW   = 'pc_view';

/* ---------- State ---------- */
let state = {
  viewYear: 2026, viewMonth: 9,
  selected: '',
  tab: 'schedule',
  editingEv: null,              // {ds, id} 正在编辑的日程（=添加模式）
  data: { records: {}, config: { habits: [] }, notes: [] },
  sync: 'none',
  syncMsg: '',
};
const WEEK_CN = ['周日','周一','周二','周三','周四','周五','周六'];
const MONTH_CN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

const $ = id => document.getElementById(id);

/* ---------- 工具函数 ---------- */
function pad0(n){ return String(n).padStart(2,'0'); }
function fmtDate(y,m,d){ return y+'-'+pad0(m+1)+'-'+pad0(d); }
function todayStr(){ const t=new Date(); return fmtDate(t.getFullYear(),t.getMonth(),t.getDate()); }
function toDate(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dateLabel(ds, withYear){
  const d = toDate(ds);
  return (withYear ? d.getFullYear()+'年' : '') + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + WEEK_CN[d.getDay()];
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin='';
  bytes.forEach(b=>{ bin+=String.fromCharCode(b); });
  return btoa(bin);
}

/* ---------- 本地持久化 ---------- */
function persistLocal(){
  try{ localStorage.setItem(LS_KEY_DATA, JSON.stringify({records:state.data.records, config:state.data.config, notes:state.data.notes||[]})); }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY_DATA);
    if(raw){ const d = JSON.parse(raw); if(d && d.records){ state.data.records = d.records; if(d.config) state.data.config = d.config; state.data.notes = d.notes || []; } }
  }catch(e){}
}

/* ---------- 云端同步（GitHub Contents API） ---------- */
function getCred(){
  return {
    token : localStorage.getItem(LS_KEY_TOKEN)  || '',
    owner : localStorage.getItem(LS_KEY_OWNER)  || DEFAULT_OWNER,
    repo  : localStorage.getItem(LS_KEY_REPO)   || DEFAULT_REPO,
  };
}
async function ghFetch(path, opts={}){
  const { token } = getCred();
  const headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    ...(opts.headers||{})
  };
  const res = await fetch('https://api.github.com' + path, {...opts, headers});
  let body = {};
  try{ body = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error(body.message || ('HTTP ' + res.status));
    err.status = res.status; err.body = body;
    throw err;
  }
  return body;
}
async function ghGetFile(){
  const { owner, repo } = getCred();
  return await ghFetch('/repos/'+owner+'/'+repo+'/contents/'+DATA_PATH + '?ref=main');
}
async function ghPutFile(contentB64, message){
  const { owner, repo } = getCred();
  let sha;
  try{ sha = (await ghGetFile()).sha; }catch(e){ if(e.status!==404) throw e; }
  return await ghFetch('/repos/'+owner+'/'+repo+'/contents/'+DATA_PATH, {
    method:'PUT',
    body: JSON.stringify({ message: message||'update records', content: contentB64, sha: sha || undefined })
  });
}

function setSync(kind, msg){
  state.sync = kind; state.syncMsg = msg || '';
  renderSync();
}
function renderSync(){
  const dot = $('syncDot'), txt = $('syncText');
  dot.className = 'dot';
  switch(state.sync){
    case 'none':   dot.className='dot';           txt.textContent='未连接云端'; break;
    case 'dirty':  dot.className='dot dirty';     txt.textContent='有改动，待同步'; break;
    case 'syncing':dot.className='dot sync';      txt.textContent='同步中…'; break;
    case 'ok':     dot.className='dot ok';
                   txt.textContent = '已同步 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); break;
    case 'error':  dot.className='dot err';       txt.textContent='同步失败：' + (state.syncMsg||''); break;
  }
}

/* ---- 串行保存：杜绝并发提交导致的版本冲突 ---- */
async function ghPutFileWithRetry(contentB64, attempt){
  try{
    await ghPutFile(contentB64, 'auto save: update calendar records');
  }catch(e){
    // GitHub 并发写冲突（409 does not match）：重新拉取最新sha再试
    if(attempt < 2 && (e.status===409 || (e.message||'').includes('does not match'))){
      return ghPutFileWithRetry(contentB64, attempt+1);
    }
    throw e;
  }
}
let saveChain = Promise.resolve();
let saveRetryTimer = null;
let saveRetryCount = 0;
async function doSaveToGithub(){
  const cred = getCred();
  if(!cred.token){ setSync('none'); return; }
  setSync('syncing');
  try{
    const payload = {
      version: 1,
      updatedAt: new Date().toISOString(),
      records: state.data.records,
      config: state.data.config,
      notes: state.data.notes || [],
    };
    await ghPutFileWithRetry(utf8ToB64(JSON.stringify(payload)), 0);
    setSync('ok');
  }catch(e){
    setSync('error', e.message || '未知错误');
    throw e;
  }
}
function saveToGithub(){
  const p = saveChain.then(()=>doSaveToGithub());
  saveChain = p.catch(()=>{});
  p.then(()=>{ saveRetryCount = 0; }).catch(()=>{
    // 失败自愈：8秒后自动静默重试（连续失败最多5次，成功即清零）
    if(saveRetryTimer || saveRetryCount >= 5) return;
    saveRetryTimer = setTimeout(()=>{
      saveRetryTimer = null;
      saveRetryCount++;
      if(state.sync === 'error') saveToGithub();
    }, 8000);
  });
  return p;
}
let saveTimer = null;
function scheduleSave(){
  if(!getCred().token){ setSync('none'); return; }
  setSync('dirty');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToGithub, 2000);
}
async function loadFromGithub(){
  const cred = getCred();
  if(!cred.token) return false;
  setSync('syncing');
  try{
    const f = await ghGetFile();
    const data = JSON.parse(b64ToUtf8(f.content));
    if(data && data.records){
      state.data.records = data.records;
      if(data.config) state.data.config = data.config;
      state.data.notes = Array.isArray(data.notes) ? data.notes : (state.data.notes || []);
      persistLocal();
      renderAll();
      setSync('ok');
      return true;
    }
    setSync('ok'); return false;
  }catch(e){
    if(e.status===404){
      setSync('ok');
      return false;
    }
    setSync('error', e.message || '加载失败');
    return false;
  }
}
/* ---- 聚焦自动同步：切回标签页/窗口时拉取云端最新 ---- */
let lastFocusSync = 0;
async function focusSync(){
  if(!getCred().token) return;
  const now = Date.now();
  if(now - lastFocusSync < 30000) return;   // 30秒节流
  lastFocusSync = now;
  try{
    if(state.sync === 'dirty'){
      await saveToGithub();
    } else if(state.sync === 'ok'){
      const prev = JSON.stringify(state.data.records);
      await loadFromGithub();
    }
  }catch(e){ /* 静默 */ }
}

/* ---------- 数据读写（业务） ---------- */
function dayRec(dateStr){
  if(!state.data.records[dateStr]) state.data.records[dateStr] = { schedule:[], todos:[], journal:'', habits:{} };
  return state.data.records[dateStr];
}
function touch(){
  persistLocal();
  scheduleSave();
}

/* ---------- 数据导出/导入 ---------- */
function exportBackup(){
  const payload = { exportedAt: new Date().toISOString(), records: state.data.records, config: state.data.config, notes: state.data.notes || [] };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'calendar-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const d = JSON.parse(ev.target.result);
      if(!d || !d.records) throw new Error('格式不正确');
      if(!confirm('导入将覆盖当前所有记录，确定继续吗？')) return;
      state.data.records = d.records;
      if(d.config) state.data.config = d.config;
      state.data.notes = d.notes || [];
      persistLocal(); renderAll();
      setToast('已导入 ' + Object.keys(d.records).length + ' 天记录', 'ok');
    }catch(e){ setToast('导入失败：' + e.message, 'err'); }
  };
  reader.readAsText(file);
}

/* ---------- 日历渲染 ---------- */
function renderCalendar(){
  const y = state.viewYear, m = state.viewMonth;
  $('calTitle').textContent = y + '年' + (m+1) + '月';
  const firstDow = (new Date(y,m,1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const tStr = todayStr();
  const sStr = state.selected;
  const cells = [];
  const total = 42;
  for(let i=0;i<total;i++){
    let cy=y, cm=m, cd, other=false;
    if(i < firstDow){ cy = m===0?y-1:y; cm = m===0?11:m-1; cd = prevDays - firstDow + 1 + i; other=true; }
    else if(i < firstDow + daysInMonth){ cd = i - firstDow + 1; }
    else { cy = m===11?y+1:y; cm = m===11?0:m+1; cd = i - firstDow - daysInMonth + 1; other=true; }
    const ds = fmtDate(cy, cm, cd);
    const rec = state.data.records[ds] || {};
    const hasSched = (rec.schedule||[]).length>0;
    const hasTodo  = (rec.todos||[]).some(t=>!t.done);
    const hasNote  = !!(rec.journal && rec.journal.trim()) || (rec.habits && Object.keys(rec.habits).some(k=>rec.habits[k]===true)) || hasNoteOn(ds);
    let dots = '';
    if(hasSched) dots += '<i class="d-sched"></i>';
    if(hasTodo)  dots += '<i class="d-todo"></i>';
    if(hasNote)  dots += '<i class="d-note"></i>';
    const cls = ['day'];
    if(other) cls.push('other');
    if(ds === tStr) cls.push('today');
    if(ds === sStr) cls.push('selected');
    cells.push('<div class="'+cls.join(' ')+'" onclick="selectDate(\''+ds+'\')"><span class="num">'+cd+'</span><div class="dots">'+dots+'</div></div>');
  }
  $('calGrid').innerHTML = '<div class="dow">一</div><div class="dow">二</div><div class="dow">三</div><div class="dow">四</div><div class="dow">五</div><div class="dow">六</div><div class="dow">日</div>' + cells.join('');
  renderCalBar();
}
function renderCalBar(){
  $('calBarText').textContent = dateLabel(state.selected, true);
}
function toggleCal(){
  const body = $('calBody'), arrow = $('calArrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

/* ---------- 面板渲染：顶部 + 输入区 + 历史流 ---------- */
function renderPanelTop(){
  const ds = state.selected;
  $('panelDate').innerHTML = dateLabel(ds, true).replace(weekOf(ds), '<span class="w">'+weekOf(ds)+'</span>');
}
function weekOf(ds){ return WEEK_CN[toDate(ds).getDay()]; }
function hasNoteOn(ds){
  return (state.data.notes||[]).some(n => noteDayKeyOf(n.createdAt) === ds);
}
function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===tab));
  renderPanel();
}
function renderPanel(){
  renderPanelTop();
  renderInputArea();
  renderFlow();
}
function renderAll(){ renderSync(); renderCalendar(); renderPanel(); }

/* ---- 输入区 ---- */
function renderInputArea(){
  const box = $('panelInput');
  box.classList.remove('hidden');
  switch(state.tab){
    case 'schedule': box.innerHTML = inputSchedule(); break;
    case 'todo':     box.innerHTML = inputTodo(); break;
    case 'journal':  box.innerHTML = inputJournal(); break;
    case 'note':     box.innerHTML = inputNote(); break;
    case 'habit':    box.classList.add('hidden'); box.innerHTML=''; break;
  }
}
function inputSchedule(){
  const editing = state.editingEv;
  if(editing){
    const rec = state.data.records[editing.ds] || {};
    const ev = (rec.schedule||[]).find(e=>e.id===editing.id) || {};
    return '<div class="quick-add editing">' +
      '<input type="time" id="evTime" value="'+escapeHtml(ev.time||'')+'" title="清空=全天">' +
      '<input type="text" id="evTitle" placeholder="标题" maxlength="60" value="'+escapeHtml(ev.title||'')+'">' +
      '<input type="text" id="evNote" placeholder="备注（可选）" maxlength="200" value="'+escapeHtml(ev.note||'')+'">' +
      '<button class="btn sm" onclick="saveSchedule()">保存</button>' +
      '<button class="btn ghost sm" onclick="cancelEdit()">取消</button>' +
      '</div><div class="qa-hint"><span class="edit-tag">正在编辑 ' + escapeHtml(dateLabel(editing.ds,false)) + ' 的日程</span> · 时间清空 = 全天</div>';
  }
  return '<input type="text" id="evTitle" placeholder="记一件事，回车添加 · 开头写 15:30 可带时间 · 不写=全天" maxlength="80" onkeydown="if(event.key===\'Enter\')quickAddSchedule()" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#FAFBFE;color:var(--text);outline:none;">' +
    '<div class="qa-hint">直接回车 = 全天日程 · 想带钟点就写在开头（如「15:30 开会」）· 点击已有日程可修改</div>';
}
function inputTodo(){
  return '<div class="quick-add">' +
    '<input type="text" id="tdInput" placeholder="添加待办，回车确认" maxlength="100" onkeydown="if(event.key===\'Enter\')quickAddTodo()">' +
    '<button class="btn sm" onclick="quickAddTodo()">添加</button>' +
    '</div>';
}
function inputJournal(){
  const rec = state.data.records[state.selected] || {};
  const saved = state.sync==='ok';
  return '<div style="position:relative;">' +
    '<textarea id="jrText" style="width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;resize:vertical;outline:none;color:var(--text);background:#FAFBFE;line-height:1.75;" placeholder="写下今天的所想、所见、所感……（自动保存）">'+escapeHtml(rec.journal||'')+'</textarea>' +
    '<div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11.5px;color:var(--text3);">' +
    '<span id="jrTip" class="'+(saved?'':'')+'" style="'+(saved?'color:var(--green);font-weight:600;':'')+'">'+(saved?'已同步云端':'自动保存到本机')+'</span>' +
    '<span id="jrCnt">0 字</span></div></div>';
}

/* ---- 历史流 ---- */
function renderFlow(){
  const el = $('panelFlow');
  switch(state.tab){
    case 'schedule': el.innerHTML = flowSchedule(); break;
    case 'todo':     el.innerHTML = flowTodo(); break;
    case 'journal':  el.innerHTML = flowJournal(); break;
    case 'note':     el.innerHTML = flowNote(); break;
    case 'habit':    el.innerHTML = flowHabit(); break;
  }
}
/* 流通用：取所有 ≤ selected 且有内容的日期，倒序 */
function flowDates(checkFn){
  const sel = state.selected;
  const arr = Object.keys(state.data.records)
    .filter(ds => ds <= sel && checkFn(state.data.records[ds]))
    .sort()
    .reverse();
  return arr;
}
function dayHead(ds, extra){
  const t = todayStr();
  let tag = '';
  if(ds === t) tag += '<span class="is-today">今天</span>';
  if(ds === state.selected) tag += '<span class="is-sel">选中</span>';
  return '<div class="fd">' + escapeHtml(dateLabel(ds, false)) + tag + (extra||'') + '</div>';
}
function flowSchedule(){
  const sel = state.selected;
  const dates = flowDates(r => (r.schedule||[]).length > 0);
  if(dates.length === 0){
    return '<div class="flow-all-empty">还没有任何日程<br>在上面输入框记第一件事吧</div>';
  }
  let html = '';
  let shownSel = false;
  dates.forEach(ds=>{
    html += dayHead(ds);
    shownSel = shownSel || ds===sel;
    const list = [...(state.data.records[ds].schedule||[])].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    list.forEach(ev=>{
      html += '<div class="ev">' +
        '<span class="ev-time'+(ev.time?'':' all')+'">'+(ev.time?escapeHtml(ev.time):'全天')+'</span>' +
        '<div class="ev-body"><div class="ev-title">'+escapeHtml(ev.title)+'</div>' +
        (ev.note?'<div class="ev-note">'+escapeHtml(ev.note)+'</div>':'') + '</div>' +
        '<div class="ev-ops">' +
        '<button class="ev-op" onclick="evEdit(\''+ds+'\',\''+ev.id+'\')" title="编辑">&#9998;</button>' +
        '<button class="ev-op del" onclick="delSchedule(\''+ds+'\',\''+ev.id+'\')" title="删除">&#10005;</button>' +
        '</div></div>';
    });
  });
  if(!shownSel && sel >= dates[dates.length-1]){
    // 选中日无日程，但历史存在时给个轻提示
  }
  return html;
}
function flowTodo(){
  const dates = flowDates(r => (r.todos||[]).length > 0);
  if(dates.length === 0){
    return '<div class="flow-all-empty">还没有待办<br>在上面输入框添加第一条吧</div>';
  }
  let html = '';
  dates.forEach(ds=>{
    const todos = state.data.records[ds].todos || [];
    const doneN = todos.filter(t=>t.done).length;
    html += dayHead(ds, '<span style="font-size:11px;color:var(--text3);font-weight:600;margin-left:2px;">'+ (doneN===todos.length && todos.length>0 ? '全部完成' : doneN+'/'+todos.length+' 完成') +'</span>');
    todos.forEach(t=>{
      html += '<div class="todo'+(t.done?' done':'')+'">' +
        '<span class="ck'+(t.done?' on':'')+'" onclick="toggleTodo(\''+t.id+'\',\''+ds+'\')"></span>' +
        '<span class="txt">'+escapeHtml(t.text)+'</span>' +
        '<button class="del" onclick="delTodo(\''+t.id+'\',\''+ds+'\')" title="删除">&#10005;</button>' +
        '</div>';
    });
  });
  return html;
}
function flowJournal(){
  const sel = state.selected;
  const dates = flowDates(r => !!(r.journal && r.journal.trim())).filter(ds=>ds!==sel);
  if(dates.length === 0){
    return '<div class="flow-all-empty">还没有历史日记<br>写下今天的，明天这里就有回忆了</div>';
  }
  let lastMonth = null;
  let html = '';
  dates.forEach(ds=>{
    const mk = ds.slice(0,7);
    if(mk !== lastMonth){
      const [yy,mm] = mk.split('-').map(Number);
      html += '<div style="font-weight:700;font-size:13px;margin:12px 0 6px;color:var(--text);">'+yy+'年'+mm+'月</div>';
      lastMonth = mk;
    }
    const j = state.data.records[ds].journal.trim();
    html += '<div class="jr-card" onclick="jrJump(\''+ds+'\')">' +
      '<div class="jc-ds"><span>'+escapeHtml(dateLabel(ds,false))+'</span><span class="go">点开编辑 ▸</span></div>' +
      '<div class="jc-text">'+escapeHtml(j)+'</div>' +
      '</div>';
  });
  return html;
}
function jrJump(ds){
  selectDate(ds);
  switchTab('journal');
}

/* ---------- 随记（想法速记，不绑定日期，按创建时间记录） ---------- */
function inputNote(){
  return '<textarea id="ntInput" rows="2" placeholder="记下一个想法、观点、灵感…（回车保存，Shift+回车可换行）" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();quickAddNote();}" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#FAFBFE;color:var(--text);outline:none;resize:vertical;line-height:1.7;"></textarea>' +
    '<div class="qa-hint">随记不占日历格子 · 自动记录时间和日期 · 会进入左侧日历圆点标记</div>';
}
function quickAddNote(){
  const ta = $('ntInput');
  const text = ta.value.trim();
  if(!text) return;
  if(!state.data.notes) state.data.notes = [];
  state.data.notes.push({ id: uid(), text: text, createdAt: new Date().toISOString() });
  ta.value = '';
  touch();
  renderCalendar(); renderFlow();
  ta.focus();
}
function delNote(id){
  if(!confirm('删除这条随记？')) return;
  state.data.notes = (state.data.notes||[]).filter(n=>n.id!==id);
  touch();
  renderCalendar(); renderFlow();
}
function noteTimeOf(iso){
  const d = new Date(iso);
  return pad0(d.getHours()) + ':' + pad0(d.getMinutes());
}
function noteDayKeyOf(iso){
  const d = new Date(iso);
  return fmtDate(d.getFullYear(), d.getMonth(), d.getDate());
}
function noteDayLabel(key){
  const t = todayStr();
  if(key === t) return '今天';
  const yd = new Date();
  yd.setDate(yd.getDate()-1);
  if(key === fmtDate(yd.getFullYear(), yd.getMonth(), yd.getDate())) return '昨天';
  const d = toDate(key);
  const ny = new Date().getFullYear();
  return (d.getFullYear()===ny ? '' : d.getFullYear()+'年') + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function flowNote(){
  const notes = (state.data.notes||[]).slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  if(notes.length === 0){
    return '<div class="flow-all-empty">还没有随记<br>上面输入框就是你的灵感捕捉器</div>';
  }
  let html = '';
  let lastKey = null;
  notes.forEach(n=>{
    const key = noteDayKeyOf(n.createdAt);
    if(key !== lastKey){
      html += '<div class="fd">' + escapeHtml(noteDayLabel(key)) + '</div>';
      lastKey = key;
    }
    html += '<div class="note-card">' +
      '<div class="nc-top"><span class="nc-time">'+escapeHtml(noteTimeOf(n.createdAt))+'</span>' +
      '<button class="nc-del" onclick="delNote(\''+n.id+'\')" title="删除">&#10005;</button></div>' +
      '<div class="nc-text">'+escapeHtml(n.text)+'</div>' +
      '</div>';
  });
  return html;
}

/* ---------- 日程操作 ---------- */
function parseQuickInput(text){
  const m = String(text).match(/^(\d{1,2})[:：](\d{1,2})\s+(.+)$/);
  if(m){
    const h = parseInt(m[1],10), mm = parseInt(m[2],10);
    if(h>=0 && h<=23 && mm>=0 && mm<=59){
      return { time: pad0(h)+':'+pad0(mm), title: m[3].trim() };
    }
  }
  return { time:'', title: String(text).trim() };
}
function quickAddSchedule(){
  const ds = state.selected;
  const raw = $('evTitle').value;
  const parsed = parseQuickInput(raw);
  if(!parsed.title){ $('evTitle').focus(); return; }
  const rec = dayRec(ds);
  rec.schedule.push({ id:uid(), time: parsed.time, title: parsed.title, note:'' });
  touch();
  renderCalendar(); renderInputArea(); renderFlow();
  const t = $('evTitle'); if(t) t.focus();
}
function saveSchedule(){
  const editing = state.editingEv;
  if(!editing) return;
  const rec = dayRec(editing.ds);
  const ev = (rec.schedule||[]).find(e=>e.id===editing.id);
  if(!ev){ cancelEdit(); return; }
  const time = $('evTime').value || '';
  const title = $('evTitle').value.trim();
  const note = $('evNote').value.trim();
  if(!title){ alert('标题不能为空'); return; }
  ev.time = time; ev.title = title; ev.note = note;
  state.editingEv = null;
  touch();
  renderCalendar(); renderInputArea(); renderFlow();
}
function cancelEdit(){ state.editingEv = null; renderInputArea(); }
function evEdit(ds, id){
  state.editingEv = { ds, id };
  renderInputArea();
  const t = $('evTitle'); if(t) t.focus();
  window.scrollTo({top:0, behavior:'smooth'});
  $('panelFlow').scrollTop = 0;
}
function delSchedule(ds, id){
  const rec = state.data.records[ds];
  if(!rec) return;
  rec.schedule = (rec.schedule||[]).filter(e=>e.id!==id);
  if(state.editingEv && state.editingEv.id===id) state.editingEv = null;
  touch();
  renderCalendar(); renderInputArea(); renderFlow();
}

/* ---------- 待办操作 ---------- */
function quickAddTodo(){
  const input = $('tdInput');
  const text = input.value.trim();
  if(!text) return;
  const rec = dayRec(state.selected);
  rec.todos.push({ id:uid(), text, done:false });
  touch();
  renderCalendar(); renderInputArea(); renderFlow();
  const i = $('tdInput'); if(i){ i.focus(); }
}
function toggleTodo(id, ds){
  ds = ds || state.selected;
  const rec = dayRec(ds);
  const t = (rec.todos||[]).find(x=>x.id===id);
  if(t){ t.done = !t.done; touch(); renderCalendar(); if(state.tab==='habit') renderPanel(); else renderFlow(); }
}
function delTodo(id, ds){
  ds = ds || state.selected;
  const rec = dayRec(ds);
  rec.todos = (rec.todos||[]).filter(t=>t.id!==id);
  touch();
  renderCalendar(); renderFlow();
}

/* ---------- 日记 ---------- */
function bindJournal(){
  const ta = $('jrText');
  if(!ta) return;
  const cnt = $('jrCnt');
  const tip = $('jrTip');
  cnt.textContent = ta.value.length + ' 字';
  ta.oninput = () => {
    const ds = state.selected;
    const rec = dayRec(ds);
    rec.journal = ta.value;
    cnt.textContent = ta.value.length + ' 字';
    tip.textContent = getCred().token ? '保存中…' : '自动保存到本机';
    tip.style.color = '';
    tip.style.fontWeight = '';
    touch();
  };
}

/* ---------- 习惯 ---------- */
function flowHabit(){
  const rec = dayRec(state.selected);
  const habits = state.data.config.habits || [];
  const doneIds = new Set(Object.keys(rec.habits||{}).filter(k=>rec.habits[k]===true));
  let html = '';
  if(habits.length===0){
    html += '<div class="habit-empty">还没有习惯，先添加一个吧<br><br><button class="btn sm" onclick="openHabitsModal()">去添加习惯</button></div>';
  } else {
    html += '<div class="habit-grid">' + habits.map(h=>{
      const on = doneIds.has(h.id);
      const st = streakFor(h.id, state.selected);
      return '<div class="habit">' +
        '<span class="h-name"><span class="h-dot" style="background:'+h.color+'"></span>'+escapeHtml(h.name)+'</span>' +
        '<span class="h-streak">连续 <b>'+st+'</b> 天</span>' +
        '<button class="rm" onclick="delHabit(\''+h.id+'\')" title="删除习惯">&#10005;</button>' +
        '<button class="check-btn'+(on?' on':'')+'" onclick="toggleHabit(\''+h.id+'\')" title="打卡/取消"></button>' +
        '</div>';
    }).join('') + '</div>';
  }
  html += '<div style="margin-top:12px;text-align:right;"><button class="btn ghost sm" onclick="openHabitsModal()">管理习惯</button></div>';
  html += renderHabitStats(habits);
  return html;
}
function toggleHabit(id){
  const ds = state.selected;
  const rec = dayRec(ds);
  if(!rec.habits) rec.habits = {};
  rec.habits[id] = !(rec.habits[id]===true);
  touch(); renderCalendar(); renderFlow();
}
function streakFor(habitId, dateStr){
  let count=0;
  const d = toDate(dateStr);
  while(true){
    const ds = fmtDate(d.getFullYear(), d.getMonth(), d.getDate());
    const r = state.data.records[ds];
    const h = r && r.habits;
    if(h && h[habitId]===true){ count++; d.setDate(d.getDate()-1); }
    else break;
  }
  return count;
}
function renderHabitStats(habits){
  if(!habits || habits.length===0) return '';
  const [y, m] = state.selected.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let html = '<div class="habit-stats"><div class="hs-title">'+y+'年'+MONTH_CN[m-1]+'打卡统计</div>';
  habits.forEach(h=>{
    let count = 0;
    for(let d=1; d<=daysInMonth; d++){
      const ds = y+'-'+pad0(m)+'-'+pad0(d);
      const r = state.data.records[ds];
      const hv = r && r.habits && r.habits[h.id];
      if(hv === true) count++;
    }
    const pct = Math.round(count/daysInMonth*100);
    html += '<div class="hs-item"><span class="hs-dot" style="background:'+h.color+'"></span>' +
      '<span class="hs-name">'+escapeHtml(h.name)+'</span>' +
      '<span class="hs-bar"><i style="width:'+pct+'%;background:'+h.color+'"></i></span>' +
      '<span class="hs-num">'+count+'/'+daysInMonth+' 天</span></div>';
  });
  html += '<div class="hs-nomonth">按选中日期所在月统计</div>';
  return html + '</div>';
}
function openHabitsModal(){ renderHabitList(); $('maskHabits').classList.add('show'); }
function closeMasks(){ document.querySelectorAll('.mask').forEach(m=>m.classList.remove('show')); }
function renderHabitList(){
  const habits = state.data.config.habits || [];
  const box = $('habitList');
  if(habits.length===0){ box.innerHTML = '<div class="flow-empty" style="padding:10px 0;">暂无习惯</div>'; return; }
  box.innerHTML = habits.map(h=>(
    '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);">' +
    '<span style="width:9px;height:9px;border-radius:50%;background:'+h.color+';flex:none;"></span>' +
    '<span style="flex:1;font-size:13.5px;">'+escapeHtml(h.name)+'</span>' +
    '<button class="link-btn" onclick="delHabit(\''+h.id+'\')" style="color:var(--red);">删除</button></div>'
  )).join('');
}
function addHabit(){
  const name = $('newHabitName').value.trim();
  const color = $('newHabitColor').value;
  if(!name){ $('habitToast').textContent='请输入习惯名称'; return; }
  if(!state.data.config.habits) state.data.config.habits=[];
  if(state.data.config.habits.some(h=>h.name===name)){ $('habitToast').textContent='该习惯已存在'; return; }
  state.data.config.habits.push({ id:uid(), name, color });
  touch(); renderCalendar(); renderPanel(); renderHabitList();
  $('newHabitName').value='';
  $('habitToast').textContent='已添加';
}
function delHabit(id){
  const habits = state.data.config.habits||[];
  const h = habits.find(x=>x.id===id);
  if(h && !confirm('删除习惯「'+h.name+'」？历史打卡记录也会一并移除展示。')) return;
  state.data.config.habits = habits.filter(x=>x.id!==id);
  Object.keys(state.data.records).forEach(ds=>{
    const r=state.data.records[ds];
    if(r && r.habits) delete r.habits[id];
  });
  touch(); renderCalendar(); renderPanel(); renderHabitList();
}

/* ---------- 日期选择与导航 ---------- */
function selectDate(ds){
  state.selected = ds;
  state.editingEv = null;
  const d = toDate(ds);
  state.viewYear = d.getFullYear(); state.viewMonth = d.getMonth();
  renderAll();
  // 移动端选完日期自动收起日历
  const body = $('calBody');
  if(body.classList.contains('open') && window.matchMedia('(max-width:960px)').matches){
    toggleCal();
  }
  $('panelFlow').scrollTop = 0;
}
function shiftMonth(delta){
  let m = state.viewMonth + delta, y = state.viewYear;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.viewYear=y; state.viewMonth=m;
  renderCalendar();
}
function goToday(){
  const t = new Date();
  state.viewYear=t.getFullYear(); state.viewMonth=t.getMonth();
  selectDate(todayStr());
}

/* ---------- 外观主题（存本机，不进云端） ---------- */
const THEME_PRESETS = {
  violet: ['#5B5FEF','#8B5CF6'],
  ocean:  ['#3B82F6','#06B6D4'],
  forest: ['#10B981','#34D399'],
  sunset: ['#F59E0B','#F97316'],
  rose:   ['#EC4899','#F472B6'],
};
const LS_KEY_THEME = 'pc_theme';
function lighten(hex, amt){
  try{
    const n = parseInt(hex.slice(1), 16);
    const clamp = v => Math.max(0, Math.min(255, v));
    const r = clamp((n>>16)+amt), g = clamp(((n>>8)&255)+amt), b = clamp((n&255)+amt);
    return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }catch(e){ return hex; }
}
function getTheme(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY_THEME)||'null') || {}; }catch(e){ return {}; }
}
function saveTheme(t){
  const merged = Object.assign(getTheme(), t);
  localStorage.setItem(LS_KEY_THEME, JSON.stringify(merged));
  applyTheme();
}
function applyTheme(){
  const t = getTheme();
  const root = document.documentElement;
  root.style.setProperty('--primary', t.primary || '#5B5FEF');
  root.style.setProperty('--primary2', t.primary2 || '#8B5CF6');
  root.style.setProperty('--bg', t.bg || '#F4F5FB');
  if(t.bgImage){
    document.body.style.backgroundImage = 'url("'+t.bgImage+'")';
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  } else {
    document.body.style.backgroundImage = '';
    document.body.style.backgroundSize = '';
    document.body.style.backgroundPosition = '';
    document.body.style.backgroundAttachment = '';
  }
  const bc = $('bgColorPick'); if(bc) bc.value = t.bg || '#F4F5FB';
  const bi = $('bgImageInput'); if(bi) bi.value = t.bgImage || '';
  const cc = $('themeCustomColor'); if(cc) cc.value = t.custom || '#5B5FEF';
  document.querySelectorAll('.pbtn').forEach(b=>{
    b.classList.toggle('on', b.dataset.p === (t.preset||'violet') && !t.custom);
  });
}
function resetTheme(){
  localStorage.removeItem(LS_KEY_THEME);
  applyTheme();
}

/* ---------- 设置 ---------- */
function openSettings(){
  const cred = getCred();
  $('setToken').value = cred.token;
  $('setOwner').value = cred.owner;
  $('setRepo').value = cred.repo;
  $('setToast').textContent='';
  applyTheme();
  $('maskSettings').classList.add('show');
}
function setToast(msg, kind){ const el=$('setToast'); el.textContent=msg; el.className='toast-msg '+(kind||''); }
async function testConnection(){
  const cred = getCred();
  if(!cred.token){ setToast('请先填写Token','err'); return; }
  setToast('测试中…');
  try{
    const user = await ghFetch('/user');
    setToast('连接成功：'+user.login+' / '+cred.owner+' · '+cred.repo, 'ok');
    if(user.login !== cred.owner){ setToast('提示：Token属于 '+user.login+'，但仓库所有者填的是 '+cred.owner+'，请确认','err'); }
  }catch(e){
    setToast('连接失败：'+(e.message||'未知错误'), 'err');
  }
}
function saveConnection(){
  const token  = $('setToken').value.trim();
  const owner  = $('setOwner').value.trim() || DEFAULT_OWNER;
  const repo   = $('setRepo').value.trim()  || DEFAULT_REPO;
  if(!token){ setToast('请填写GitHub Token','err'); return; }
  localStorage.setItem(LS_KEY_TOKEN, token);
  localStorage.setItem(LS_KEY_OWNER, owner);
  localStorage.setItem(LS_KEY_REPO, repo);
  setToast('已保存，正在从云端加载…');
  loadFromGithub().then(ok=>{
    closeMasks();
    setSync('ok');
    renderAll();
    if(!ok) alert('云端还没有数据文件，已为你准备好本地数据，首次保存会自动在云端创建。');
  }).catch(()=>{ closeMasks(); renderAll(); });
}

/* ---------- 初始化 ---------- */
function init(){
  try{
    const v = JSON.parse(localStorage.getItem(LS_KEY_VIEW)||'null');
    if(v){ state.viewYear=v.y; state.viewMonth=v.m; state.selected=v.s; }
  }catch(e){}
  loadLocal();
  if(!state.selected){
    const t = new Date();
    state.viewYear=t.getFullYear(); state.viewMonth=t.getMonth();
    state.selected = todayStr();
  }
  renderAll();
  if(getCred().token){
    loadFromGithub().then(ok=>{ if(ok) renderAll(); });
  } else {
    setSync('none');
  }
  window.addEventListener('beforeunload', ()=>{
    try{ localStorage.setItem(LS_KEY_VIEW, JSON.stringify({y:state.viewYear,m:state.viewMonth,s:state.selected})); }catch(e){}
  });
  window.addEventListener('focus', focusSync);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') focusSync(); });
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('DOMContentLoaded', ()=>{
  $('btnSettings').addEventListener('click', openSettings);
  $('btnSyncNow').addEventListener('click', ()=>{ if(getCred().token) saveToGithub(); else alert('请先点击右上角设置，填入GitHub Token'); });
  $('btnTestConn').addEventListener('click', testConnection);
  $('btnSaveConn').addEventListener('click', saveConnection);
  $('btnAddHabit').addEventListener('click', addHabit);
  $('btnExport').addEventListener('click', exportBackup);
  $('btnImport').addEventListener('click', ()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.onchange=()=>{ if(inp.files[0]) importBackup(inp.files[0]); }; inp.click(); });
  $('btnClearLocal').addEventListener('click', ()=>{
    if(!confirm('确定清空本机缓存的日历数据吗？此操作不会删除云端数据，重新同步会恢复。')) return;
    localStorage.removeItem(LS_KEY_DATA);
    loadLocal();
    renderAll();
    setToast('本地缓存已清空','ok');
  });
  document.querySelectorAll('.mask').forEach(m=>{
    m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('show'); });
  });
  // 外观自定义
  document.querySelectorAll('.pbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const pair = THEME_PRESETS[b.dataset.p];
      saveTheme({preset: b.dataset.p, primary: pair[0], primary2: pair[1], custom: ''});
    });
  });
  $('themeCustomColor').addEventListener('input', e=>{
    const c = e.target.value;
    saveTheme({preset:'', custom:c, primary:c, primary2:lighten(c, 36)});
  });
  $('bgColorPick').addEventListener('input', e=>{ saveTheme({bg: e.target.value}); });
  $('bgImageInput').addEventListener('change', e=>{
    const v = e.target.value.trim();
    if(v && !/^https?:\/\//i.test(v)){
      alert('背景图片请填写 http(s) 开头的图片链接');
      e.target.value = '';
      return;
    }
    saveTheme({bgImage: v});
  });
  $('btnResetTheme').addEventListener('click', ()=>{ resetTheme(); });
  applyTheme();
  const observer = new MutationObserver(()=>{ if(state.tab==='journal') bindJournal(); });
  observer.observe($('panelInput'), {childList:true});
  init();
});
</script>
